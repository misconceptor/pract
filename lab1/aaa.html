<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RGB Color Picker</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f6f8fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 32px 36px 40px;
        }
        h1 {
            font-weight: 600;
            font-size: 26px;
            color: #0b1a2f;
            margin-bottom: 24px;
        }
        .color-preview {
            width: 100%;
            height: 80px;
            border-radius: 18px;
            background: #ff4d4d;
            margin-bottom: 28px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: background 0.05s;
        }
        .slider-section {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-row label {
            width: 20px;
            font-weight: 600;
            font-size: 14px;
            color: #25364d;
            text-transform: uppercase;
        }
        .slider-row input[type="range"] {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: #d7dfea;
            border-radius: 10px;
            outline: none;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1f2e47;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            cursor: pointer;
        }
        .slider-row input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1f2e47;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            cursor: pointer;
        }
        .slider-row .value-input {
            width: 58px;
            padding: 4px 4px 4px 8px;
            border: 1px solid #d0d9e8;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            background: white;
            text-align: center;
            color: #142433;
        }
        .slider-row .value-input:focus {
            border-color: #2d4b8a;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 75, 138, 0.15);
        }
        .hex-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f2f6fe;
            border-radius: 16px;
            padding: 12px 18px;
            margin-top: 6px;
            border: 1px solid #e2eaf5;
        }
        .hex-row span {
            font-weight: 500;
            color: #1f3049;
        }
        .hex-row .hex-value {
            font-family: 'Fira Mono', monospace;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #0b1a2f;
            background: white;
            padding: 2px 16px;
            border-radius: 40px;
            border: 1px solid #d5dfed;
        }
        .hex-row .copy-btn {
            margin-left: auto;
            background: #e2eaf5;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 500;
            font-size: 13px;
            color: #1a2d47;
            cursor: pointer;
            transition: 0.15s;
        }
        .hex-row .copy-btn:hover {
            background: #cbd7e9;
        }
        @media (max-width: 480px) {
            .app {
                padding: 20px 18px 28px;
            }
            .slider-row .value-input {
                width: 48px;
                font-size: 13px;
            }
            .hex-row {
                flex-wrap: wrap;
            }
            .hex-row .copy-btn {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <h1>RGB Color</h1>
        <div class="color-preview" id="preview" style="background: #ff4d4d;"></div>
        <div class="slider-section">
            <div class="slider-row">
                <label>R</label>
                <input type="range" id="rSlider" min="0" max="255" value="255" />
                <input type="number" class="value-input" id="rInput" value="255" min="0" max="255" />
            </div>
            <div class="slider-row">
                <label>G</label>
                <input type="range" id="gSlider" min="0" max="255" value="77" />
                <input type="number" class="value-input" id="gInput" value="77" min="0" max="255" />
            </div>
            <div class="slider-row">
                <label>B</label>
                <input type="range" id="bSlider" min="0" max="255" value="77" />
                <input type="number" class="value-input" id="bInput" value="77" min="0" max="255" />
            </div>
        </div>
        <div class="hex-row">
            <span>HEX</span>
            <span class="hex-value" id="hexDisplay">#FF4D4D</span>
            <button class="copy-btn" id="copyHex">Copy</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            var preview = document.getElementById('preview');
            var rSlider = document.getElementById('rSlider');
            var gSlider = document.getElementById('gSlider');
            var bSlider = document.getElementById('bSlider');
            var rInput = document.getElementById('rInput');
            var gInput = document.getElementById('gInput');
            var bInput = document.getElementById('bInput');
            var hexDisplay = document.getElementById('hexDisplay');
            var copyBtn = document.getElementById('copyHex');

            var updating = false;

            function rgbToHex(r, g, b) {
                return ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            }

            function updateFromRGB(r, g, b) {
                if (updating) return;
                updating = true;

                r = Math.min(255, Math.max(0, Math.round(r)));
                g = Math.min(255, Math.max(0, Math.round(g)));
                b = Math.min(255, Math.max(0, Math.round(b)));

                rSlider.value = r;
                gSlider.value = g;
                bSlider.value = b;
                rInput.value = r;
                gInput.value = g;
                bInput.value = b;

                var hex = '#' + rgbToHex(r, g, b);
                hexDisplay.textContent = hex;
                preview.style.backgroundColor = 'rgb(' + r + ', ' + g + ', ' + b + ')';

                updating = false;
            }

            function bindSliderAndInput(slider, input, callback) {
                slider.addEventListener('input', function() {
                    var val = Number(slider.value);
                    input.value = val;
                    callback(val);
                });
                input.addEventListener('input', function() {
                    var val = Number(input.value);
                    if (isNaN(val)) return;
                    var min = Number(input.min);
                    var max = Number(input.max);
                    if (val < min) val = min;
                    if (val > max) val = max;
                    slider.value = val;
                    input.value = val;
                    callback(val);
                });
                input.addEventListener('blur', function() {
                    var val = Number(input.value);
                    if (isNaN(val)) {
                        val = Number(slider.value);
                        input.value = val;
                        return;
                    }
                    var min = Number(input.min);
                    var max = Number(input.max);
                    if (val < min) val = min;
                    if (val > max) val = max;
                    slider.value = val;
                    input.value = val;
                    callback(val);
                });
            }

            bindSliderAndInput(rSlider, rInput, function(val) {
                var r = Math.round(val);
                var g = Math.round(Number(gSlider.value));
                var b = Math.round(Number(bSlider.value));
                updateFromRGB(r, g, b);
            });
            bindSliderAndInput(gSlider, gInput, function(val) {
                var r = Math.round(Number(rSlider.value));
                var g = Math.round(val);
                var b = Math.round(Number(bSlider.value));
                updateFromRGB(r, g, b);
            });
            bindSliderAndInput(bSlider, bInput, function(val) {
                var r = Math.round(Number(rSlider.value));
                var g = Math.round(Number(gSlider.value));
                var b = Math.round(val);
                updateFromRGB(r, g, b);
            });

            copyBtn.addEventListener('click', function() {
                var hex = hexDisplay.textContent;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(hex).then(function() {
                        copyBtn.textContent = 'Copied!';
                        setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
                    }).catch(function() { fallbackCopy(hex); });
                } else {
                    fallbackCopy(hex);
                }
            });

            function fallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    copyBtn.textContent = 'Copied!';
                    setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
                } catch (e) {
                    alert('Failed to copy: ' + text);
                }
                document.body.removeChild(ta);
            }

            updateFromRGB(255, 77, 77);
        })();
    </script>

</body>
</html>
